<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>萌えセレクト講義｜PO・TORO LESSON</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app" aria-label="萌えセレクト講義">
    <section class="novel-stage">
      <img class="scene-bg" src="img/scene_main.png" alt="萌えセレクト講義の背景" />

      <div class="progress-panel" aria-label="講義の進捗">
        <span class="progress-title">講義の進捗</span>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-count" id="progressCount">1 / 18</span>
      </div>

      <div class="speech-bubble teacher-bubble" id="teacherBubble">
        <div class="speaker-badge">先生</div>
        <p class="line-text" id="teacherLine"></p>
      </div>

      <div class="speech-bubble student-bubble" id="studentBubble">
        <div class="speaker-badge">生徒</div>
        <p class="line-text" id="studentLine"></p>
      </div>

      <div class="tap-layer" id="tapLayer" aria-label="次へ進む"></div>

      <nav class="control-bar" aria-label="操作ボタン">
        <button type="button" class="control-btn sub" id="prevBtn">‹ 前へ</button>
        <button type="button" class="control-btn auto" id="autoBtn">▶ オート再生</button>
        <button type="button" class="control-btn main" id="nextBtn">次へ ›</button>
      </nav>
    </section>
  </main>

  <script src="js/dialogue.js"></script>
  <!-- ▼ 横向き案内 -->
<div id="rotateNotice">
  <div class="rotateInner">
    <div class="rotateIcon">📱↻</div>
    <div class="rotateTitle">横向きでご利用ください</div>
    <div class="rotateText">
      萌えセレクト講義は<br>
      横画面専用で設計されています♡
    </div>
  </div>
</div>

</body>
</html>
